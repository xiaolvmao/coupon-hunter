name: Build iOS IPA

on:
  workflow_dispatch:      # 手动触发
  push:
    branches: [ main ]    # 推送到 main 自动触发

jobs:
  build:
    runs-on: macos-14     # GitHub 免费提供的 macOS 云机器
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (unsigned, no signing cert needed)
        run: |
          xcodebuild -project CouponHunter.xcodeproj \
            -target CouponHunter \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build CONFIGURATION_BUILD_DIR=build

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r "build/CouponHunter.app" "build/Payload/"
          cd build
          zip -r CouponHunter.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CouponHunter-ipa
          path: build/CouponHunter.ipa
